<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plato · ticket board</title>
<style>
  :root {
    --bg: #f3f2ee; --col: #e9e7e1; --card: #ffffff; --ink: #1f1e1b; --muted: #75716a; --line: #dedad2;
    --accent: #3b5bdb; --accent-soft: #e7ecff; --plato: #2f6f5a; --plato-soft: #e2f0ea; --warn: #b4690e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --col: #1c1b19; --card: #23221f; --ink: #edeae3; --muted: #9d988f; --line: #33312d;
      --accent: #8da2ff; --accent-soft: #232a45; --plato: #7fc6ab; --plato-soft: #1d2d27; --warn: #e3a35a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { font-size: 16px; margin: 0; }
  .pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; }
  .working { font-size: 13px; color: var(--plato); }
  header .spacer { flex: 1; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 6px 12px; }
  button.primary { background: var(--accent); border-color: transparent; color: #fff; }
  input, textarea, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; }
  textarea { resize: vertical; min-height: 90px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .intro { padding: 10px 22px 0; color: var(--muted); font-size: 13.5px; }
  .board { display: grid; grid-template-columns: repeat(4, minmax(200px, 1fr)); gap: 14px; padding: 14px 22px 40px; }
  .col { background: var(--col); border-radius: 12px; padding: 10px; min-height: 260px; }
  .col h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 2px 4px 10px; display: flex; justify-content: space-between; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; margin-bottom: 9px; cursor: pointer; display: block; width: 100%; text-align: left; }
  .card:hover { border-color: var(--accent); }
  .card .id { font-size: 12px; color: var(--muted); }
  .card .title { font-weight: 600; margin: 2px 0 8px; }
  .card .foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
  .who { display: inline-flex; align-items: center; gap: 5px; }
  .av { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 13px; background: var(--accent-soft); }
  .av.plato { background: var(--plato-soft); }
  .badge-busy { color: var(--plato); font-size: 12px; }
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 18px; width: min(520px, 94vw); background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.25); }
  dialog h3 { margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--card); border-left: 1px solid var(--line);
          transform: translateX(100%); transition: transform .18s ease; overflow-y: auto; padding: 18px 20px 40px; box-shadow: -8px 0 24px rgba(0,0,0,.06); z-index: 3; }
  aside.on { transform: none; }
  aside .top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 13px; }
  aside h2 { margin: 6px 0 12px; font-size: 20px; }
  .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .files a { display: inline-block; margin: 4px 8px 0 0; color: var(--accent); cursor: pointer; }
  pre.file { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 13px; max-height: 320px; overflow: auto; }
  .activity { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 10px; }
  .act { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 8px 0; }
  .act .what { font-size: 13px; color: var(--muted); }
  .act .what b { color: var(--ink); }
  .act .text { white-space: pre-wrap; margin-top: 2px; }
  .act.plato .text { background: var(--plato-soft); padding: 6px 9px; border-radius: 8px; }
  @media (max-width: 860px) { .board { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 520px) { .board { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>🦉 Team board</h1><span class="pill" id="model">connecting…</span><span class="working" id="working" aria-live="polite"></span>
  <span class="spacer"></span><button class="primary" type="button" id="newBtn">New ticket</button>
</header>
<div class="intro">No chat here: assign a ticket to <b>plato</b> and it works it like a teammate. It comments, attaches what it made, and moves the ticket to Review.</div>
<main class="board" id="board"></main>

<dialog id="newDlg">
  <form method="dialog" id="newForm">
    <h3>New ticket</h3>
    <label for="nTitle">Title</label><input id="nTitle" required placeholder="Draft a launch checklist for the new pricing page">
    <label for="nDesc">Description</label><textarea id="nDesc" placeholder="What's needed, for whom, any constraints."></textarea>
    <label for="nAssignee">Assignee</label>
    <select id="nAssignee"><option value="plato">🦉 plato (assistant)</option><option value="">Unassigned</option></select>
    <div class="row"><button type="button" id="cancelNew">Cancel</button><button class="primary" type="submit">Create</button></div>
  </form>
</dialog>

<aside id="drawer" aria-label="Ticket details">
  <div class="top"><span id="dId"></span><button type="button" id="closeDrawer" aria-label="Close">✕</button></div>
  <h2 id="dTitle"></h2>
  <div class="meta">
    <div><label for="dStatus">Status</label><select id="dStatus"></select></div>
    <div><label for="dAssignee">Assignee</label><select id="dAssignee"><option value="plato">🦉 plato</option><option value="">Unassigned</option></select></div>
  </div>
  <label for="dDesc">Description</label><textarea id="dDesc"></textarea>
  <div class="row" style="justify-content:flex-start;margin-top:6px"><button type="button" id="saveDesc">Save description</button></div>
  <label>Attachments</label><div class="files" id="dFiles"></div><pre class="file" id="dFile" hidden></pre>
  <div class="activity"><label>Activity</label><div id="dActivity"></div>
    <label for="dComment">Comment</label><textarea id="dComment" placeholder="Feedback for plato lands on its ticket and wakes it."></textarea>
    <div class="row" style="justify-content:flex-start"><button class="primary" type="button" id="sendComment">Comment</button></div>
  </div>
</aside>

<script>
const COLS = [["todo", "To do"], ["in_progress", "In progress"], ["review", "Review"], ["done", "Done"]];
const st = { after: 0, tickets: new Map(), open: null, busy: false };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const api = async (path, body) => { await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); poll(); };

function fold(ev) {  // the same fold the agent's TicketCard uses
  const id = ev.artifact.slice("ticket:".length);
  const t = st.tickets.get(id) || { id, title: "", description: "", status: "todo", assignee: null, files: [], activity: [] };
  if (ev.surface === "status" && ev.op === "created") { t.title = ev.payload.title; t.description = ev.text; }
  if (ev.surface === "edit") t.description = ev.text;
  if (ev.surface === "status" && ev.op === "assigned") t.assignee = ev.payload.assignee;
  if (ev.surface === "status" && ev.op === "moved") t.status = ev.payload.status;
  if (ev.surface === "attach") t.files.push(ev.payload.path);
  t.activity.push(ev);
  st.tickets.set(id, t);
}

function who(actor) { return actor === "plato" ? '<span class="av plato">🦉</span>' : '<span class="av">🙂</span>'; }

function renderBoard() {
  const board = $("board"); board.innerHTML = "";
  for (const [key, name] of COLS) {
    const items = [...st.tickets.values()].filter((t) => t.status === key);
    const col = document.createElement("section"); col.className = "col"; col.setAttribute("aria-label", name);
    col.innerHTML = `<h2><span>${name}</span><span>${items.length}</span></h2>`;
    for (const t of items) {
      const c = document.createElement("button"); c.type = "button"; c.className = "card";
      const working = st.busy && t.assignee === "plato" && (t.status === "in_progress" || t.status === "todo");
      c.innerHTML = `<div class="id">${esc(t.id)}</div><div class="title">${esc(t.title)}</div>
        <div class="foot"><span class="who">${t.assignee ? who(t.assignee) + esc(t.assignee) : "unassigned"}</span>
        <span>${working ? '<span class="badge-busy">working…</span>' : t.files.length ? "📎 " + t.files.length : ""}</span></div>`;
      c.onclick = () => openTicket(t.id);
      col.appendChild(c);
    }
    board.appendChild(col);
  }
}

function describeEvent(ev) {
  const name = ev.actor === "plato" ? "plato" : ev.actor;
  if (ev.surface === "status" && ev.op === "created") return `<b>${esc(name)}</b> created the ticket`;
  if (ev.surface === "status" && ev.op === "assigned") return `<b>${esc(name)}</b> assigned it to ${esc(ev.payload.assignee || "nobody")}`;
  if (ev.surface === "status" && ev.op === "moved") return `<b>${esc(name)}</b> moved it to ${esc(ev.payload.status.replace("_", " "))}`;
  if (ev.surface === "edit") return `<b>${esc(name)}</b> edited the description`;
  if (ev.surface === "attach") return `<b>${esc(name)}</b> attached ${esc(ev.payload.path)}`;
  if (ev.surface === "comment") return `<b>${esc(name)}</b> commented`;
  return `<b>${esc(name)}</b> ${esc(ev.surface)}`;
}

function renderDrawer() {
  const t = st.tickets.get(st.open); if (!t) return;
  $("dId").textContent = t.id; $("dTitle").textContent = t.title;
  $("dStatus").innerHTML = COLS.map(([k, n]) => `<option value="${k}" ${k === t.status ? "selected" : ""}>${n}</option>`).join("");
  $("dAssignee").value = t.assignee || "";
  if (document.activeElement !== $("dDesc")) $("dDesc").value = t.description;
  $("dFiles").innerHTML = t.files.length ? "" : '<span style="color:var(--muted);font-size:13px">none yet</span>';
  for (const f of t.files) { const a = document.createElement("a"); a.textContent = "📎 " + f; a.tabIndex = 0;
    a.onclick = async () => { const d = await (await fetch("/api/file?path=" + encodeURIComponent(f))).json(); $("dFile").hidden = false; $("dFile").textContent = d.content; };
    $("dFiles").appendChild(a); }
  $("dActivity").innerHTML = t.activity.map((ev) => `<div class="act ${ev.actor === "plato" ? "plato" : ""}">${who(ev.actor)}
    <div><div class="what">${describeEvent(ev)}</div>${ev.surface === "comment" ? `<div class="text">${esc(ev.text)}</div>` : ""}</div></div>`).join("");
}

function openTicket(id) { st.open = id; $("dFile").hidden = true; renderDrawer(); $("drawer").classList.add("on"); }

let polling = false;
async function poll() {
  if (polling) return; polling = true;
  try {
    const d = await (await fetch(`/api/state?after=${st.after}`)).json();
    d.events.forEach(fold);
    st.after = d.last_seq; st.busy = d.busy;
    $("model").textContent = d.model;
    $("working").textContent = d.busy ? "🦉 plato is working…" : "";
    renderBoard(); if (st.open) renderDrawer();
  } catch { $("model").textContent = "server stopped"; } finally { polling = false; }
}

$("newBtn").onclick = () => { $("newForm").reset(); $("newDlg").showModal(); $("nTitle").focus(); };
$("cancelNew").onclick = () => $("newDlg").close();
$("newForm").onsubmit = (e) => { e.preventDefault(); api("/api/create", { title: $("nTitle").value, description: $("nDesc").value, assignee: $("nAssignee").value }); $("newDlg").close(); };
$("closeDrawer").onclick = () => { st.open = null; $("drawer").classList.remove("on"); };
$("dStatus").onchange = () => api("/api/move", { id: st.open, status: $("dStatus").value });
$("dAssignee").onchange = () => api("/api/assign", { id: st.open, assignee: $("dAssignee").value });
$("saveDesc").onclick = () => api("/api/edit", { id: st.open, description: $("dDesc").value });
$("sendComment").onclick = () => { const t = $("dComment").value.trim(); if (!t) return; api("/api/comment", { id: st.open, text: t }); $("dComment").value = ""; };
poll(); setInterval(poll, 800);
</script>
</body>
</html>
