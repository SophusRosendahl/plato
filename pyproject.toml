[project]
name = "plato"
version = "0.0.1"
description = "Event-driven, code-first agent harness (spike)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["openai>=1.40", "anthropic>=2.14"]
dev = ["pytest", "openai>=1.40", "anthropic>=2.14"]

[project.scripts]
plato = "plato.__main__:main"

[tool.setuptools.packages.find]
include = ["plato*"]

[tool.setuptools.package-data]
plato = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
