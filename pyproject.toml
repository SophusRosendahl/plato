[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plato"
version = "0.1.0"
description = "An event-driven, code-first agent harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["openai>=1.40", "anthropic>=2.14"]
dev = ["pytest", "ruff", "openai>=1.40", "anthropic>=2.14"]

[project.scripts]
plato = "plato.__main__:main"

[tool.setuptools.packages.find]
include = ["plato*"]

[tool.setuptools.package-data]
plato = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # lets tests import examples/ and demos/

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ruff's defaults plus "top-level imports only" (PLC0415). Optional third-party
# SDKs imported inside the adapter that needs them carry an inline noqa.
select = ["E4", "E7", "E9", "F", "PLC0415"]
